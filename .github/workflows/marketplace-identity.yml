name: Determine Marketplace Identity

on: workflow_dispatch

jobs:
  identity:
    runs-on: ubuntu-latest
    environment: insider-channel        # reuses federated credential gh-insider-channel
    permissions:
      id-token: write
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Print marketplace identity
        run: az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798
